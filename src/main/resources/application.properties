spring.application.name=share-bill

# Cổng: trên Render dùng biến PORT do Render cấp; ở máy tính dùng 8686.
# Nếu đổi 8686: sửa cả API_PORT trong mobile/src/lib/api.ts rồi thêm lại icon trên iPhone.
server.port=${PORT:8686}

# ---------- Database ----------
# Ở máy tính: H2, lưu vào file ./data/sharebill.mv.db
# Trên mạng: đặt DATABASE_URL = chuỗi kết nối Neon (postgresql://...), xem ShareBillApplication.
# Hoặc đặt riêng DB_URL (jdbc:postgresql://...) / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sharebill;AUTO_SERVER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Xem database H2 tại http://localhost:8686/h2-console (tắt trên mạng bằng H2_CONSOLE=false)
spring.h2.console.enabled=${H2_CONSOLE:true}

# ---------- Bảo mật ----------
# Mật khẩu chung để vào app. Để trống = không cần mật khẩu (chỉ nên để trống khi chạy ở máy tính).
sharebill.password=${APP_PASSWORD:}
# Các địa chỉ web khác được phép gọi API (dùng khi phát triển bằng Expo web ở cổng 8081)
sharebill.cors-origins=${CORS_ORIGINS:http://localhost:8081,http://127.0.0.1:8081}
